name: CI

on:
  push:
    branches: [main]
  pull_request:

# A privacy product should not run two migrations against the same branch concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Postgres runs in-process via PGlite (WASM), so there is no service container and
      # no Docker dependency. Schema, constraints, triggers and RLS are exercised against
      # a real Postgres engine.
      - name: Database — schema, constraints, RLS isolation
        run: pnpm test:db

      # The leak suite inspects the real production build — initial HTML, RSC/Flight
      # payload and every emitted chunk — so the build must exist first. The test fails
      # rather than skips when it does not.
      - name: Build web
        run: pnpm --filter @cloakcal/web build
        env:
          NEXT_PUBLIC_CLOAKCAL_DEV_UNLOCK: '1'

      # Kept as its own step, not folded into `pnpm test`, so a privacy leak is visible
      # as a distinctly named red check rather than one failure among many.
      - name: Privacy leakage
        run: pnpm test:leak

      # Recurrence and DST correctness gate the whole calendar (ADR 0001), so they get a
      # named check rather than hiding inside the aggregate run.
      - name: Domain — recurrence, DST, edit scopes
        run: pnpm test:domain

      # Named separately: if server redaction and client View As ever diverge, that is a
      # privacy failure and should read as one in the checks list, not as "unit tests red".
      - name: Policy vectors (server and client must agree)
        run: pnpm test:vectors

      - name: Unit and domain
        run: pnpm test

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # E2E runs against the DEV server on purpose: the development key legitimately
      # cannot unlock a production build, and relaxing that gate to suit a test would
      # trade a real guarantee for a convenient one. Production artifacts are covered by
      # the build-output leak suite above.
      - name: E2E, accessibility and visual
        run: npx playwright test
        env:
          NEXT_PUBLIC_CLOAKCAL_DEV_UNLOCK: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
